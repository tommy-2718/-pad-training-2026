<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品在庫管理システム（演習用）</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ログイン画面 -->
  <div id="loginArea" class="login-wrapper">
    <div class="login-card">
      <h1>商品在庫管理システム</h1>
      <p class="login-subtitle">Power Automate Desktop 演習用デモ</p>

      <div class="form-group">
        <label for="loginUser">ユーザーID</label>
        <input type="text" id="loginUser" placeholder="ユーザーIDを入力" autocomplete="off">
        <p class="hint">※正解のIDは admin です。</p>
      </div>

      <div class="form-group">
        <label for="loginPassword">パスワード</label>
        <input type="password" id="loginPassword" placeholder="パスワードを入力" autocomplete="off">
        <p class="hint">※正解のパスワードは password です。</p>
      </div>

      <p id="loginError" class="login-error">ユーザーIDまたはパスワードが違います。</p>

      <button id="loginButton" type="button" onclick="doLogin()">ログイン</button>
    </div>
  </div>

  <!-- 商品在庫検索画面 -->
  <div id="mainArea" class="container">
    <button id="goToLoginButton" class="go-to-login-button" type="button">ログイン画面に移動</button>
    <button id="resetPageButton" class="reset-page-button" type="button">このページを初期化</button>
    <header>
      <h1>商品在庫検索</h1>
      <p>商品名・発注要否で絞り込めます。空欄のまま検索すると全件表示します。</p>
    </header>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="商品名を入力（例：鉛筆、シャープペン）"
        autocomplete="off"
      >
      <select id="statusFilter">
        <option value="">すべて</option>
        <option value="発注必要">発注必要</option>
        <option value="発注不要">発注不要</option>
      </select>
      <button id="searchButton" type="button">検索</button>
      <button id="lagSearchButton" type="button">検索（ラグあり）</button>
    </div>

    <div class="result-count" id="resultCount"></div>

    <div class="table-wrapper">
      <table id="resultTable">
        <thead>
          <tr>
            <th>商品ID</th>
            <th>商品名</th>
            <th>金額（円）</th>
            <th>在庫数</th>
            <th>発注基準</th>
            <th>発注要否</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>

    <div id="noResultMessage" class="no-result-message">該当する商品はありません。</div>
  </div>

  <script src="script.js?v=20260925-6"></script>
</body>
</html>
